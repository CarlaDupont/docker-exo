# Stack d'observabilité, à lancer à côté de la stack du TP04 (projet "shop") :
#   docker compose -f compose.observability.yml up -d
# Elle rejoint les réseaux shop_front / shop_back pour scraper l'API et le worker.
name: observability
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - default
      - shop_front
      - shop_back
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    # Docker Desktop stocke les images avec containerd : la partie "docker" de cAdvisor ne trouve
    # pas les couches des conteneurs. On lit les conteneurs dans containerd (espace "moby") et on
    # désactive la partie docker en la faisant pointer vers une socket qui n'existe pas.
    command:
      - --housekeeping_interval=15s
      - --docker=unix:///var/run/absent.sock
      - --containerd=/containerd.sock
      - --containerd-namespace=moby
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /run/containerd/containerd.sock:/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

networks:
  shop_front: { external: true }
  shop_back:  { external: true }

volumes:
  prometheus-data:
  loki-data:
  promtail-data:
  grafana-data:
