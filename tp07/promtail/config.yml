server:
  http_listen_port: 9080
  grpc_listen_port: 0

# position de lecture de chaque conteneur, gardée dans un volume pour ne pas tout renvoyer au redémarrage
positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # tous les conteneurs de la machine, lus par l'API Docker (socket)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
    pipeline_stages:
      # pino écrit "level":30, le worker "level":"INFO" : les deux deviennent un label
      - json:
          expressions:
            level: level
      - labels:
          level:
