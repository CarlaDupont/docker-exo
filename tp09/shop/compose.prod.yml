x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  proxy:
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api:
    <<: *hardening
    build: !reset null
    image: ${REGISTRY:?REGISTRY manquant dans .env}/shop-api:${VERSION:?VERSION manquant (ex. sha-1a2b3c4 ou 1.0.0)}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  worker:
    <<: *hardening
    build: !reset null
    image: ${REGISTRY:?REGISTRY manquant dans .env}/shop-worker:${VERSION:?VERSION manquant (ex. sha-1a2b3c4 ou 1.0.0)}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
