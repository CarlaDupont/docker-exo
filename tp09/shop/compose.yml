name: shop

x-healthcheck-defaults: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# l'appli ne lit que DATABASE_URL : on la construit au démarrage à partir du secret
x-database-url: &database-url
  entrypoint:
    - /bin/sh
    - -c
    - export DATABASE_URL="postgres://shop:$$(cat /run/secrets/db_password)@db:5432/shop" && exec "$$@"
    - --

services:
  proxy:
    image: traefik:v3.1
    restart: unless-stopped
    environment:
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: shop_front
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_PING: "true"
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_ACCESSLOG_FORMAT: json
      # un réplica qui vient d'être supprimé ne répond plus du tout : on abandonne vite pour réessayer ailleurs
      TRAEFIK_SERVERSTRANSPORT_FORWARDINGTIMEOUTS_DIALTIMEOUT: 1s
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    logging: *logging

  api:
    <<: *database-url
    build: ./apps/shopapi
    image: shop-api:dev
    command: ["node", "src/server.js"]
    restart: unless-stopped
    # temps laissé à l'API après SIGTERM pour finir ses requêtes en cours
    stop_grace_period: 15s
    environment:
      REDIS_URL: redis://redis:6379
    secrets:
      - db_password
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.localhost`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.healthcheck.path: /health
      traefik.http.services.api.loadbalancer.healthcheck.interval: 10s
      # pendant les ~2 s où Traefik route encore vers un réplica arrêté, la requête est rejouée sur un autre
      traefik.http.middlewares.api-retry.retry.attempts: "3"
      traefik.http.middlewares.api-retry.retry.initialinterval: 100ms
      traefik.http.routers.api.middlewares: api-retry
    logging: *logging

  worker:
    <<: *database-url
    build:
      context: ./apps/shop-worker
      secrets:
        - pipconf
    image: shop-worker:dev
    command: ["python", "-m", "worker.main"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    secrets:
      - db_password
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
    logging: *logging

  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - back
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    logging: *logging

  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.adminer.rule: Host(`adminer.localhost`)
      traefik.http.routers.adminer.entrypoints: web
      traefik.http.services.adminer.loadbalancer.server.port: "8080"
    logging: *logging

  migrate:
    image: postgres:16.4-alpine
    profiles: ["ops"]
    environment:
      MIGRATION: ${MIGRATION:-}
    entrypoint:
      - /bin/sh
      - -c
      - PGPASSWORD="$$(cat /run/secrets/db_password)" psql -h db -U shop -d shop -v ON_ERROR_STOP=1 -f "/migrations/$${MIGRATION:?MIGRATION=fichier.sql manquant}"
    secrets:
      - db_password
    volumes:
      - ./db/migrations:/migrations:ro
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

networks:
  front:
  back:
    internal: true

volumes:
  pgdata:
  redisdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pipconf:
    file: ./apps/shop-worker/pip.conf
