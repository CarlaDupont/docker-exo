# Compose de préprod corrigé après l'incident (voir INCIDENT.md, le fichier d'origine est dans starter/).
# Les mots de passe viennent de .env (non versionné, modèle dans .env.example).
name: incident
services:
  front:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 et pas localhost : localhost donne ::1 et nginx n'écoute qu'en IPv4
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ../tp01/shopapi
    environment:
      DATABASE_URL: postgres://shop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/shop
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}@redis:6379
    networks:
      - public
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    # celui de l'image appelle /health, qui répond ok même sans base ni redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../tp04/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  public:
  backend:
    internal: true

volumes:
  pgdata:
